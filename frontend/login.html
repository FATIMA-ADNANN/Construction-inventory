```
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Construction Inventory - Login</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f6f8;
    }

    .login-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
    }

    .login-box {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
    }

    .login-box h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #222;
    }

    .login-box .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    .input-group input:focus {
        outline: none;
        border-color: #333;
    }

    .login-button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 6px;
        background: #222;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .login-button:hover {
        background: #444;
    }

    #loginMessage {
        text-align: center;
        margin-top: 15px;
        min-height: 20px;
        color: #d32f2f;
    }
</style>
```

</head>

<body>

```
<div class="login-container">

    <div class="login-box">

        <h1>Construction Inventory</h1>

        <p class="subtitle">
            Login to access the inventory system
        </p>

        <form id="loginForm">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


            <p id="loginMessage"></p>

        </form>

    </div>

</div>


<script src="login.js"></script>
```

</body>

</html>
